# /run 是 tmpfs：条子、待办、批准记录重启即全清（刻意的，不跨重启存活）。
#
# grants：签发者组可写（签发条子 = 往这里落文件），并带粘滞位：POSIX 的删除权只看父
# 目录的 w+x、不看文件属主 —— 没有 sticky 时任何组员都能 unlink 别人的条子，CLI 侧
# 「删别人的需要 root」在文件系统层就不成立。1775 = 组员只能删自己建的那一张；
# 服务侧只读，单次性靠用量记录。
# pending：粘滞位，AI 以自身身份只能删自己建的待办，不能删别人的。
# approvals：只有 root 能写 —— AI 无论怎么折腾都批准不了自己。
d /run/daedalus 0755 root root -
d /run/daedalus/grants 1775 root daedalus-signers -
d /run/daedalus/pending 1777 root root -
d /run/daedalus/approvals 0755 root root -
