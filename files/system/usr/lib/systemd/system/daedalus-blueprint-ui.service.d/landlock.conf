[Service]
# daedalus-blueprint-ui 的 Landlock/seccomp 加固 drop-in。
#
# 内容与 daedalus-blueprint.service.d/landlock.conf 的 [Service] 段**必须一致**:
# 两条路径(UI 点"应用" / AI 调 blueprint_apply)跑的是同一个 applyOnce、写同一批
# 输出目录、spawn 同一批 post_check 命令,沙箱面不应因为入口不同而不等。
# 漂移由 tests/build/blueprint-ui-unit.sh 逐字节比对 [Service] 段钉死
# (它比本文件注释更权威 —— 改这里必须同时改 blueprint 那份,否则门禁红)。
#
# 为什么 UI 的沙箱只能更严不能更松:UI 的输入来自浏览器(虽然已过 Host/Origin/
# 自定义头/loopback 四道闸),而 MCP 的输入来自 agent。RestrictNetworkInterfaces=lo
# 保证它连不出去,MemoryDenyWriteExecute 保证没有 W+X 页。
CPUQuota=50%
MemoryMax=256M
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @obsolete
MemoryDenyWriteExecute=yes
RestrictNetworkInterfaces=lo
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
LockPersonality=yes
ProtectClock=yes
ProtectHostname=yes
