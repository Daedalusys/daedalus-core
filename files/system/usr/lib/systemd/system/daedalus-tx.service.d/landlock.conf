[Service]
CPUQuota=50%
MemoryMax=256M
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @obsolete
MemoryDenyWriteExecute=yes
RestrictNetworkInterfaces=lo
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
LockPersonality=yes
ProtectClock=yes
ProtectHostname=yes
# 只读面只覆盖两处：条子(grants，不能伪造)与批准记录(approvals，不能自我批准)。
# pending 保持可写 —— 第三档的落地就是本服务往那里落自己的待办；sticky 位保证删不掉别人的。
ReadOnlyPaths=/run/daedalus/grants /run/daedalus/approvals
