[Service]
CPUQuota=50%
MemoryMax=256M
# baloosearch 触发 KF6 客户端库,需 fork 子进程;AF_UNIX 必需(本机
# D-Bus + KF6 客户端连接 Baloo daemon);AF_INET/AF_INET6 留作 baloosearch
# 偶发远程索引回退(极少启用,默认不联网)。无 @privileged / @resources 行为
# 是因为 baloosearch 不直接读 /dev/disk 与 /proc/<pid>/io。
SystemCallFilter=@system-service ~@privileged ~@resources ~@obsolete
MemoryDenyWriteExecute=yes
RestrictNetworkInterfaces=lo
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
LockPersonality=yes
ProtectClock=yes
ProtectHostname=yes
