# 巡检配置 —— 清单与运行参数的单一事实源。
#
# 清单为空时巡检无事可做:没有清单项就没有巡检轮次,也不会发信。全局项对所有节点生效;
# 节点专属段同名项逐字段覆盖、异名项追加,多项必须写数组表 [[node."<节点 id>".checklist.item]]。
#
# SMTP 凭据走 systemd 凭据目录($CREDENTIALS_DIRECTORY/smtp-{username,password}),不进本文件。
# interval 只是参考周期:真正的调度者是 daedalus-patrol.timer,改节奏改 timer。默认不开巡检。

[patrol]
interval = "30m"
# node_timeout 只约束 AI 客户端的执行时长;网关在本机,投递有自己的连接时限。
node_timeout = "10m"

[patrol.ai_client]
# 命令由运维定,换客户端不改代码。示例用 opencode:
# 「除 MCP 工具外全部 deny」靠生成的客户端配置里的 permissions 数组(deny * → allow patrol-node_*),
# 与 opencode 的版本语义绑定 —— 客户端需支持 V2 的 permissions 数组(用旧版 permission 的不行)。
# 这里不写 --agent:默认 agent 名在客户端侧才存在,写死一个不存在的名字只会让它回落默认并打警告。
command = ["opencode", "--standalone", "run", "--auto", "--format", "json"]

[patrol.smtp]
host = ""
port = 0
from = ""
to = []
starttls = true
