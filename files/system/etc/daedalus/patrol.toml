# 巡检配置 —— 清单与运行参数的单一事实源。
#
# 清单为空时巡检无事可做:没有清单项就没有巡检轮次,也不会发信。
# 全局项对所有节点生效;节点专属段同名项逐字段覆盖全局项,异名项追加为本机专属项。
# 节点段里的多项清单必须用数组表写法:[[node."<节点 id>".checklist.item]]
#
# SMTP 凭据走 systemd LoadCredential(/etc/credstore/...),不进本文件;
# [patrol.smtp] 只放投递参数。
#
# 默认不开巡检:要不要跑由运维显式装 systemd timer 单元决定,本文件不启用任何东西。

[patrol]
interval = "30m"
node_timeout = "10m"

[patrol.ai_client]
command = ["opencode", "--standalone", "run", "--auto", "--agent", "inspector", "--format", "json"]

[patrol.smtp]
host = ""
port = 0
from = ""
to = []
starttls = true
