[Service]
# daedalus-blueprint 的 Landlock/seccomp 加固 drop-in(与其余能力服务器同款):
# 仅放行 systemd @system-service 白名单系统调用,显式拒 @privileged/@resources/@obsolete;
# MemoryDenyWriteExecute 禁 W+X(Go 静态二进制天然满足);
# 网络面收敛到 loopback + AF_UNIX/AF_INET/AF_INET6 —— post_check 的
# redis-cli ping / psql 走本机回环与 Unix socket 即满足。
CPUQuota=50%
MemoryMax=256M
SystemCallFilter=@system-service ~@privileged ~@resources ~@obsolete
MemoryDenyWriteExecute=yes
RestrictNetworkInterfaces=lo
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
LockPersonality=yes
ProtectClock=yes
ProtectHostname=yes
