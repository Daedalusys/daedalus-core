---
# daedalus-core 仓 CI(拆仓后本文件即 core 仓的 .github/workflows/build.yml)。
#
# 布局约定(post-split 3 仓平级 clone):
#   - 主仓检出到 workspace 下的 daedalus-core/ 子目录(GH Actions 禁止 checkout
#     逃出 GITHUB_WORKSPACE,故不能用 ../daedalus-sdk 兄弟形态);所有 run 步骤
#     以 working-directory: daedalus-core 运行,go.mod / tests/deno/ / files/ /
#     plugin/ / cmd/ / justfile 的相对引用基准即此根。
#   - daedalus-sdk checkout 到 workspace 下的 daedalus-sdk/ 子目录,从
#     daedalus-core/ 解析 ../daedalus-sdk 与 tests/deno 的 ../daedalus-sdk/...
#     正好落到平级兄弟位置。ref 用 pinned-tag 策略(review Oracle Issue 3 +
#     Issue 7):版本从 go.mod 的 `require github.com/Daedalusys/daedalus-sdk
#     vX.Y.Z` 提取,不写死字面量;占位版本 v0.0.0(本地 replace 开发形态)或缺失
#     时输出空 ref 走 SDK 默认分支,不在 CI 启动期 fail-closed。
#   - daedalus-plugins 的 release zip 在镜像构建 job 内联下载(review Oracle
#     Issue 5:原 plan 把下载拆到 todo 15,但 workflow 是 todo 14 写的,漏集成)。
#   - testdata drift 守门放本 workflow(review Oracle Issue 3 修正:SDK 仓独立
#     CI 没有 core 兄弟仓,diff 无法跑;core 仓有 SDK 兄弟 checkout + 生产
#     policy.toml,在此 diff 生产 policy.toml ↔ SDK testdata 副本)。
name: Build Daedalus Core
on:
  pull_request:
    # 反向白名单:仅忽略纯文档/模板,其余路径变更都触发 CI(改任何代码/脚本/
    # manifest 都跑)。正向白名单容易漏列新加的脚本。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    # 触发器:任何 push(除了纯文档/模板)都至少跑 test job;镜像构建与发布
    # (build-image job)由其自身 if: 限定到 feat/* 分支推送、任何 tag 推送、
    # workflow_dispatch。发版:合并到 feat/<name> 后 push,或 git tag v0.2.0
    # && git push --tags。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      VARIANT:
        description: 'Desktop variant to build (default: kde)'
        required: false
        default: 'kde'
        type: string
      PUSH:
        description: '推送到 ghcr.io(打 :latest/:<sha>/:upstream 三个 tag);默认 false,仅构建+验证不推'
        required: false
        default: 'false'
        type: boolean

# 并发:同一 ref 同一 workflow 同时只跑一个;新 push 自动取消旧 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# 最小权限默认 contents:read;packages:write 仅在 build-image job 内升级。
permissions:
  contents: read

jobs:
  # ---- 日常 CI:任何 push / PR / dispatch 都跑(无镜像构建,反馈快) ----
  test:
    name: Test (go / deno / i18n / drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 主仓检出到 daedalus-core 子目录:go.mod 的 replace => ../daedalus-sdk
          # 与 tests/deno 的相对引用经父目录解析到 workspace 下的兄弟仓;把主仓
          # 检出到子目录是唯一不逃出 GITHUB_WORKSPACE 的合法布局。
          path: daedalus-core

      - name: Extract SDK version from go.mod
        # pinned-tag 策略(review Oracle Issue 7):SDK 版本从 go.mod 的
        # `require github.com/Daedalusys/daedalus-sdk vX.Y.Z` 提取,传给下方
        # SDK checkout 的 ref: v$SDK_VERSION;不写死字面量占位符。
        # 占位版本(v0.0.0,replace 本地开发形态)或缺失一律放行:输出空的
        # sdk_version,SDK checkout 回退默认分支;不在 CI 启动期 fail-closed。
        id: sdk-version
        shell: bash
        working-directory: daedalus-core
        run: |
          SDK_VERSION=$(sed -n 's/.*daedalus-sdk v\([0-9.]*\).*/\1/p' go.mod | head -1)
          if [ -z "$SDK_VERSION" ] || [ "$SDK_VERSION" = "0.0.0" ]; then
            echo "占位版本或版本缺失($SDK_VERSION);输出空 sdk_version,SDK checkout 走默认分支" >&2
            SDK_VERSION=""
          fi
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "SDK_VERSION=$SDK_VERSION"

      - name: Checkout daedalus-sdk (sibling, pinned tag)
        # review Oracle Issue 3:SDK 必须检出到 workspace 下的 daedalus-sdk 子目录,
        # 与主仓 daedalus-core 子目录平级,使 go.mod 的 `replace => ../daedalus-sdk`
        # 与 tests/deno 的 `../daedalus-sdk/...` 相对引用在 CI 中可解析。
        # ref 为空(go.mod 为占位版本)时 checkout SDK 默认分支。
        uses: actions/checkout@v4
        with:
          repository: Daedalusys/daedalus-sdk
          path: daedalus-sdk
          ref: ${{ steps.sdk-version.outputs.sdk_version != '' && format('v{0}', steps.sdk-version.outputs.sdk_version) || '' }}

      - name: Set Up Go Toolchain
        # go.mod pins `go 1.25.0`;runner image 可能更老,显式 pin。
        # setup-go 缓存 go.sum;vendor/ 不入库,首次构建走 module proxy。
        # 主仓在 daedalus-core 子目录,缓存依赖文件路径须带前缀。
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: daedalus-core/go.sum

      - name: Set Up Deno Runtime
        # copilot 测试套件 (tests/deno/) 由 deno 跑。
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up just
        # test job 的多个 gate(go-test / 后续 recipe)都用 just 编排;
        # ubuntu-latest 默认不带 just,必须显式装。
        shell: bash
        working-directory: daedalus-core
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y just
          just --version

      - name: Prepare justfile.local (gitignored stub for import)
        # 主 justfile 加了 `import "justfile.local"`。本机私有 recipe 永不进库
        # (.gitignore),但 CI clone 出来没有该文件 → just 解析期 fail,整条
        # pipeline 挂掉。touch 一个空文件兜底:空 import 等价无操作。
        shell: bash
        working-directory: daedalus-core
        run: |
          touch justfile.local
          ls -la justfile.local

      - name: Go Test Gate
        # Go 全量单元测试(含 controller/tx 契约缝测试)。
        shell: bash
        working-directory: daedalus-core
        run: just go-test

      - name: Build Core Binaries (Go)
        # Deno 套件的磁盘断言(audit.test.ts getAuditBinary / exec.test.ts tx 默认
        # 解析)要求仓库构建产物 bin/daedalus-{audit,tx} 真实存在——测试注释即写明
        # 前置 "CI 先 just go-build"。shell 断言拆仓后走入库安装态副本
        # files/system/usr/local/bin/daedalus-shell(exec.test.ts 已列双候选)。
        # go-test 只编译不产出,故在 Deno 门前补这一步(bin/ 为 gitignored 构建产物,
        # 与 build-image job 同款)。
        shell: bash
        working-directory: daedalus-core
        run: just go-build

      - name: Deno Test Suite
        # copilot 测试套件(含 shellpolicy_contract 跨语言契约,读 ../daedalus-sdk)。
        shell: bash
        working-directory: daedalus-core
        run: deno test --allow-all tests/deno/

      - name: i18n Keys Gate
        # i18n 键集门禁:en↔zh 对称 + t() 字面量双 locale 存在性。
        shell: bash
        working-directory: daedalus-core
        run: bash tests/deno/i18n_keys.test.sh

      - name: testdata drift gate (production policy.toml ↔ SDK testdata)
        # review Oracle Issue 3:生产 policy.toml 与 SDK 的 testdata 副本必须
        # 一致,否则 SDK 的 3 点漂移测试校验的是过期副本。不一致即 fail。
        shell: bash
        working-directory: daedalus-core
        run: |
          diff files/system/opt/daedalus/shared/policy.toml ../daedalus-sdk/policy/testdata/policy.toml
          echo "OK: 生产 policy.toml 与 SDK testdata 一致"

  # ---- 镜像构建与发布:仅 feat/* 分支 / 任何 tag / workflow_dispatch 才跑 ----
  # 依赖 test 通过;日常 PR 与普通分支 push 不到此处,反馈快。
  # 跨仓集成:daedalus-plugins 的 release zip 在此 job 内联下载(review Oracle
  # Issue 5),解压到镜像树安装态后 `just build` 构建镜像。
  build-image:
    name: Build & Publish Daedalus Image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/tags/') }}
    # 升级 packages:write 权限(仅本 job 需要;ghcr.io 推送)。
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [kde]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 同 test job:主仓检出到 daedalus-core 子目录,不逃出 GITHUB_WORKSPACE。
          path: daedalus-core

      - name: Extract SDK version from go.mod
        # 同 test job:pinned-tag 策略,SDK checkout 的 ref 从 go.mod 提取;
        # 占位版本 v0.0.0 或缺失时输出空 sdk_version,SDK checkout 走默认分支。
        id: sdk-version
        shell: bash
        working-directory: daedalus-core
        run: |
          SDK_VERSION=$(sed -n 's/.*daedalus-sdk v\([0-9.]*\).*/\1/p' go.mod | head -1)
          if [ -z "$SDK_VERSION" ] || [ "$SDK_VERSION" = "0.0.0" ]; then
            echo "占位版本或版本缺失($SDK_VERSION);输出空 sdk_version,SDK checkout 走默认分支" >&2
            SDK_VERSION=""
          fi
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout daedalus-sdk (sibling, pinned tag)
        # 同 test job:SDK 检出到 workspace 下的 daedalus-sdk 子目录;ref 为空
        # (go.mod 为占位版本)时 checkout 默认分支。
        uses: actions/checkout@v4
        with:
          repository: Daedalusys/daedalus-sdk
          path: daedalus-sdk
          ref: ${{ steps.sdk-version.outputs.sdk_version != '' && format('v{0}', steps.sdk-version.outputs.sdk_version) || '' }}

      - name: Set up Podman / Buildah
        shell: bash
        working-directory: daedalus-core
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y podman qemu-user-static just

      - name: Set Up Go Toolchain
        # 主仓在 daedalus-core 子目录,缓存依赖文件路径须带前缀。
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: daedalus-core/go.sum

      - name: Prepare justfile.local (gitignored stub for import)
        # 同 test job:CI clone 出来没有 justfile.local,just 解析会 fail。
        # 必须先于第一个 `just` 调用(下方 Build Core Binaries)执行。
        shell: bash
        working-directory: daedalus-core
        run: |
          touch justfile.local
          ls -la justfile.local

      - name: Build Core Binaries (Go)
        # 构建 core 仓全部 Go 静态二进制到 bin/(拆仓后 ./cmd/... 仅 5 个:
        # daedalus-host / daedalus-audit / daedalus-tx / daedalus-smoke /
        # daedalus-plugin-pack;shell/service 主源在 daedalus-plugins 仓)。
        shell: bash
        working-directory: daedalus-core
        run: just go-build

      - name: Download plugin zips from daedalus-plugins release
        # review Oracle Issue 5:镜像构建 job 内联 plugin zip 下载(跨仓集成)。
        # daedalus-plugins 仓 release 出 7 个 *.plugin.zip(fs/shell/pkg/sysinfo/
        # service/blueprint/dupe);gh 在 runner 预装且
        # 经 GITHUB_TOKEN 认证。todo 15 的 fetch-plugins.sh 只做本地等价兜底,
        # 不重复描述本 workflow 步骤。下载目录用绝对路径 /tmp,不受 cwd 影响。
        shell: bash
        working-directory: daedalus-core
        run: |
          mkdir -p /tmp/plugins-release
          gh release download --repo Daedalusys/daedalus-plugins --pattern '*.plugin.zip' --dir /tmp/plugins-release/
          ls -la /tmp/plugins-release/

      - name: Unpack plugin zips into image tree install state
        # 解压即校验(daedalus-plugin-pack -verify --keep):任一 checksum 不符
        # 拒绝安装(fail-closed)。安装态落 files/system/opt/daedalus/plugins/,
        # 经 just build 的 sync 腿同步进镜像 /opt/daedalus/plugins。
        shell: bash
        working-directory: daedalus-core
        run: |
          for zip in /tmp/plugins-release/*.plugin.zip; do
            id=$(basename "$zip" .plugin.zip)   # daedalus.fs / daedalus.shell / ...
            dest="files/system/opt/daedalus/plugins/$id"
            mkdir -p "$dest"
            find "$dest" -mindepth 1 -delete
            ./bin/daedalus-plugin-pack -verify "$zip" --keep "$dest"
            echo "unpacked: $id"
          done

      - name: Install core binaries to image tree
        # 仅 host/audit/tx 三个 core 新鲜构建产物进 files/system/usr/local/bin/
        # (76-daedalus-plugin-gen.sh 与 copilot wrapper 的 deno --allow-run 旗标
        # 放行路径依赖)。拆仓后 shell/service 的 /usr/local/bin 落位由**入库安装态
        # 副本**(files/system/usr/local/bin/,just plugin-pack 产物,随仓 checkout +
        # just build 的 sync 腿进镜像)+ 插件 zip 解包态(files/system/opt/daedalus/
        # plugins/daedalus.{shell,service}/bin/)双轨提供,不再由 core go-build 构建。
        shell: bash
        working-directory: daedalus-core
        run: |
          install -Dm0755 bin/daedalus-host files/system/usr/local/bin/daedalus-host
          install -Dm0755 bin/daedalus-audit files/system/usr/local/bin/daedalus-audit
          install -Dm0755 bin/daedalus-tx files/system/usr/local/bin/daedalus-tx

      - name: Build Daedalus Container Image
        # just build = sync(scripts/sync-daedalus.sh 把 files/ 同步进 base_image
        # vendor 树,CI 上从 AlmaLinux/atomic-desktop 浅克隆 bootstrap)+ podman build。
        # 镜像内 76-daedalus-plugin-gen.sh 从安装态渲染 systemd ExecStart 并自校验。
        # DAEDALUS_FETCH_ZIP_DIR:上方步骤已把 release zip 下到 /tmp/plugins-release,
        # fetch-plugins 腿经 --local-zip-dir 复用(gh download 拒覆盖同名文件),
        # 解压即校验语义不变。
        shell: bash
        working-directory: daedalus-core
        env:
          DAEDALUS_FETCH_ZIP_DIR: /tmp/plugins-release
        run: just build

      - name: Verify Image Zero-Residue
        # 断言镜像 /opt 内无 Python 源码/字节码、__pycache__、Deno 测试文件、
        # Go 模块/依赖残留。任一新布局构建产物泄漏进 rootfs 即 exit 1。
        shell: bash
        working-directory: daedalus-core
        run: |
          podman run --rm localhost/daedalus-os:latest sh -c 'test -z "$(find /opt -name "*.py" -o -name "*.pyc" -o -name "__pycache__" -o -name "*.test.ts" -o -name "go.mod" -o -type d -name vendor 2>/dev/null)"' || { echo "ERROR: residue found in image /opt"; exit 1; }

      - name: Verify Image & Bootc Container Lint
        shell: bash
        working-directory: daedalus-core
        run: |
          podman run --rm localhost/daedalus-os:latest cat /usr/lib/os-release || true
          podman run --rm localhost/daedalus-os:latest bootc --version || true
          echo "Daedalus bootc container verification completed successfully."

      # ---- 发布:OCI 镜像 → ghcr.io (bootc 原生分发形态) ----
      # job 级 if: 已限定到 feat/* 分支 / 任何 tag / workflow_dispatch;此处再
      # 过滤 workflow_dispatch.PUSH=false 的纯构建(只构建+验证不推)场景。
      - name: Log in to ghcr.io
        # GITHUB_TOKEN 自动注入,无需手动 secret
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.PUSH == 'true' }}
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI image to ghcr.io
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.PUSH == 'true' }}
        shell: bash
        working-directory: daedalus-core
        env:
          OWNER_LOWER: ${{ github.repository_owner }}
        run: |
          # repository_owner 可能含大写,ghcr 要求全小写路径
          IMAGE="ghcr.io/${OWNER_LOWER,,}/daedalus-os"
          podman tag localhost/daedalus-os:latest "${IMAGE}:latest"
          podman tag localhost/daedalus-os:latest "${IMAGE}:${{ github.sha }}"
          podman push "${IMAGE}:latest"
          podman push "${IMAGE}:${{ github.sha }}"
          # :upstream 是 bootc 原地升级 (KVM guest 上 `bootc upgrade ghcr.io/<owner>/daedalus-os:upstream`)
          # 的稳定别名,与 :latest/:sha 共存,指向同一镜像内容。
          podman tag localhost/daedalus-os:latest "${IMAGE}:upstream"
          podman push "${IMAGE}:upstream"
          echo "Pushed: ${IMAGE}:latest (+ sha tag, + upstream tag)"

      # ---- 发布:qcow2 → artifact (本地 KVM 测试用;bootc-image-builder 产出) ----
      # 限额说明:GitHub Release 单文件硬限 2GiB,KDE qcow2 可能超;artifact 上限
      # 10GB 更稳。若未来要挂 Release,先 gzip 或分卷。
      - name: Export OCI archive (rootless → rootful handoff)
        # bootc-image-builder 的 --local 模式硬性要求 rootful podman
        # ("this command must be run in rootful"),而 Actions 的构建在
        # rootless 存储里。用 save/load 把镜像从用户存储转交 root 存储。
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.PUSH == 'true' }}
        shell: bash
        working-directory: daedalus-core
        run: podman save --format oci-archive -o /tmp/daedalus-os.oci.tar localhost/daedalus-os:latest

      - name: Build qcow2 disk image (bootc-image-builder, rootful)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.PUSH == 'true' }}
        shell: bash
        working-directory: daedalus-core
        run: |
          sudo podman load -i /tmp/daedalus-os.oci.tar
          mkdir -p output/qcow2
          # rootful podman 的存储在 /var/lib/containers/storage(load 已导入),
          # builder 容器内硬编码该路径找镜像 → 同名对同名挂载(root 存储进容器)
          # 输出目录用 workspace 绝对路径,与 working-directory(daedalus-core)对齐。
          sudo podman run --rm \
            --privileged \
            --security-opt label=disable \
            -v ${{ github.workspace }}/daedalus-core/output/qcow2:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --local --type qcow2 --output /output localhost/daedalus-os:latest
          # builder 以 root 写产物,归还属主给 runner 用户(artifact 上传需要)
          sudo chown -R $(id -u):$(id -g) output/qcow2
          ls -lh output/qcow2/

      - name: Upload qcow2 artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.PUSH == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-os-qcow2-${{ matrix.variant }}
          # upload-artifact 的相对路径以 workspace 根为基准(不受 run 步骤的
          # working-directory 影响),故这里必须带 daedalus-core/ 前缀。
          path: daedalus-core/output/qcow2/
          # 默认保留 90 天;qcow2 预计 3-6GB,远低于 artifact 10GB 上限
          if-no-files-found: error
          compression-level: 0
