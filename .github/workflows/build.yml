---
# daedalus-core 仓 CI(拆仓后本文件即 core 仓的 .github/workflows/build.yml)。
#
# 布局约定:主仓检出到 workspace 的 daedalus-core/ 子目录(GH Actions 禁止
# checkout 逃出 GITHUB_WORKSPACE),所有 run 步骤以它为 cwd;SDK 检出到平级的
# daedalus-sdk/ 子目录,使 go.mod 的 replace => ../daedalus-sdk 可解析,版本从
# go.mod 的 require 行提取(pinned-tag),占位/缺失时回退 SDK 默认分支。
# daedalus-plugins 的 release zip 在镜像构建 job 内联下载;policy.toml drift
# 守门放本 workflow(只有这里同时具备 SDK 兄弟仓与生产 policy.toml)。
name: Build Daedalus Core
on:
  pull_request:
    # 不加 paths-ignore:required status check 一旦被路径过滤掉,纯文档 PR 就没有
    # check 来源,合并门永挂 "Expected"(daedalus-plugins #64 实测栽在这,#65 拆掉同款过滤)。
    # core main 当前没有分支保护也没有 ruleset,这条纯属防御:哪天钉上 required check
    # 时不必再踩一遍。
  push:
    # 触发器:任何 push(除了纯文档/模板)都至少跑 test job;镜像构建与发布
    # (build-image job)由其自身 if: 限定到 main 分支推送、feat/* 分支推送、
    # 任何 tag 推送、workflow_dispatch。发版:合并到 feat/<name> 后 push,或
    # git tag v0.2.0 && git push --tags。
    # 发布分档见 build-image job 末段:main / tag / dispatch(PUSH=true) 才写
    # :latest 与 :upstream,feat/* 只写 :<sha>。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      VARIANT:
        description: 'Image variant to build (default: headless)'
        required: false
        default: 'headless'
        type: string
      PUSH:
        description: '推送到 ghcr.io(打 :latest/:<sha>/:upstream 三个 tag);默认 false,仅构建+验证不推'
        required: false
        default: false
        type: boolean

# 并发:同一 ref 同一 workflow 同时只跑一个;新 push 自动取消旧 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# 最小权限默认 contents:read;packages:write 仅在 build-image job 内升级。
permissions:
  contents: read

jobs:
  # 日常 CI:任何 push / PR / dispatch 都跑(无镜像构建,反馈快)。
  test:
    name: Test (go / deno / i18n / drift)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 不把 GITHUB_TOKEN 持久化进工作区的 .git/config:本 workflow 没有任何
          # 一步靠 .git/config 的 http.extraheader 取凭据(gh / podman-login /
          # goreleaser 都从 env 显式取 token),默认的 persist-credentials=true
          # 只是徒留一份在整个 job 生命周期内存活的凭据。本文件其余 checkout 同此。
          persist-credentials: false
          # 主仓检出到 daedalus-core 子目录:go.mod 的 replace => ../daedalus-sdk
          # 与 tests/deno 的相对引用经父目录解析到 workspace 下的兄弟仓;把主仓
          # 检出到子目录是唯一不逃出 GITHUB_WORKSPACE 的合法布局。
          path: daedalus-core

      - name: Extract SDK version from go.mod
        # pinned-tag 策略:SDK 版本从 go.mod 的
        # `require github.com/Daedalusys/daedalus-sdk vX.Y.Z` 提取,传给下方
        # SDK checkout 的 ref: v$SDK_VERSION;不写死字面量占位符。
        # 占位版本(v0.0.0,replace 本地开发形态)或缺失一律放行:输出空的
        # sdk_version,SDK checkout 回退默认分支;不在 CI 启动期 fail-closed。
        id: sdk-version
        shell: bash
        working-directory: daedalus-core
        run: |
          SDK_VERSION=$(sed -n 's/.*daedalus-sdk v\([0-9.]*\).*/\1/p' go.mod | head -1)
          if [ -z "$SDK_VERSION" ] || [ "$SDK_VERSION" = "0.0.0" ]; then
            echo "占位版本或版本缺失($SDK_VERSION);输出空 sdk_version,SDK checkout 走默认分支" >&2
            SDK_VERSION=""
          fi
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "SDK_VERSION=$SDK_VERSION"

      - name: Checkout daedalus-sdk (sibling, pinned tag)
        # SDK 必须检出到 workspace 下的 daedalus-sdk 子目录,
        # 与主仓 daedalus-core 子目录平级,使 go.mod 的 `replace => ../daedalus-sdk`
        # 与 tests/deno 的 `../daedalus-sdk/...` 相对引用在 CI 中可解析。
        # ref 为空(go.mod 为占位版本)时 checkout SDK 默认分支。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Daedalusys/daedalus-sdk
          path: daedalus-sdk
          ref: ${{ steps.sdk-version.outputs.sdk_version != '' && format('v{0}', steps.sdk-version.outputs.sdk_version) || '' }}

      - name: Checkout daedalus-plugins (sibling)
        # SDK 的官方 manifest 跨仓校验读 `../../daedalus-plugins/<cap>/` 与
        # `../../daedalus-core/plugin/copilot/`:从 SDK 包目录上溯两级正是本
        # workspace 根,三仓平级检出即吃满。SDK 仓自己的 CI 里 Actions 不许
        # checkout 逃出 GITHUB_WORKSPACE,那条测试在那边显式 skip,执行点在此。
        # 走默认分支:manifest 唯一事实源就是插件仓源码,镜像里的 zip 是另一回事。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Daedalusys/daedalus-plugins
          path: daedalus-plugins

      - name: Set Up Go Toolchain
        # go.mod pins `go 1.25.0`;runner image 可能更老,显式 pin。
        # setup-go 缓存 go.sum;vendor/ 不入库,首次构建走 module proxy。
        # 主仓在 daedalus-core 子目录,缓存依赖文件路径须带前缀。
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          # 本 job 由 pull_request 触发 → 显式关掉 module cache。cache 按分支
          # 作用域共享:基础分支能读到 PR 分支写入的条目(实测本仓已存在
          # refs/pull/64/merge 写入的 setup-go 条目),那正是 cache 投毒的读侧。
          cache: false
          cache-dependency-path: daedalus-core/go.sum

      - name: Set Up Deno Runtime
        # copilot 测试套件 (tests/deno/) 由 deno 跑。
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Set up just
        # test job 的多个 gate(go-test / 后续 recipe)都用 just 编排;
        # ubuntu-latest 默认不带 just,必须显式装。
        shell: bash
        working-directory: daedalus-core
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y just
          just --version

      - name: Prepare justfile.local (gitignored stub for import)
        # 主 justfile 加了 `import "justfile.local"`。本机私有 recipe 永不进库
        # (.gitignore),但 CI clone 出来没有该文件 → just 解析期 fail,整条
        # pipeline 挂掉。touch 一个空文件兜底:空 import 等价无操作。
        shell: bash
        working-directory: daedalus-core
        run: |
          touch justfile.local
          ls -la justfile.local

      - name: Go Test Gate
        # Go 全量单元测试(含 controller/tx 契约缝测试)。
        shell: bash
        working-directory: daedalus-core
        run: just go-test

      - name: systemd unit static gate
        # 单元从未被真实 systemd 解析是所有接线漂移的共因。本门禁零成本:
        # 不构建镜像,只跑 systemd-analyze 的解析级检查(见脚本头注释)。
        shell: bash
        working-directory: daedalus-core
        run: just verify-units

      - name: plugin inventory gate
        # 四份插件清单(76 CAPS / 插件单元 / 插件 manifest / plugins release 供料)必须相等。
        # 缺一份就等于「有 manifest 没二进制」的插件会随镜像交付(core#53)。
        shell: bash
        working-directory: daedalus-core
        run: just verify-inventory

      - name: Official manifest cross-repo gate
        # SDK 的 TestValidate_OfficialPluginManifests 在 SDK 仓 CI 里因缺兄弟仓
        # 显式 skip,这里是它唯一的真实执行点:校验 9 个能力插件与 copilot 共
        # 10 个官方 manifest 全部通过 C1 schema(api_version/license/maintainer
        # 齐备;copilot 保留老字符串 runtime 形态)。
        # 只跑这一条,避免把 SDK 全量测试在 core CI 重复一遍(SDK 自己的 CI 覆盖其余)。
        shell: bash
        working-directory: daedalus-sdk
        run: go test ./plugin/ -run TestValidate_OfficialPluginManifests -count=1

      - name: Build Core Binaries (Go)
        # Deno 套件的磁盘断言(audit.test.ts getAuditBinary / exec.test.ts tx 默认
        # 解析)要求仓库构建产物 bin/daedalus-{audit,tx} 真实存在——测试注释即写明
        # 前置 "CI 先 just go-build"。
        # go-test 只编译不产出,故在 Deno 门前补这一步(bin/ 为 gitignored 构建产物,
        # 与 build-image job 同款)。
        shell: bash
        working-directory: daedalus-core
        run: just go-build

      - name: Materialize Install State (plugin-pack)
        # exec.test.ts 的磁盘断言要求 files/system/usr/local/bin/daedalus-shell 真实
        # 存在。core 拆仓后不自产 shell(主源在 ../daedalus-plugins/shell),且该落位是
        # just plugin-pack 构建产物、不入库,故在此现构落位。
        # 必须走 recipe 而非内联 go build:插件仓各 cap 的 `replace => ../daedalus-sdk`
        # 只在插件仓自身 workspace 成立,三仓平级布局要靠 plugin-pack 内建的临时软链桥
        # (trap EXIT 清理),该逻辑单一事实源在 justfile,不在 workflow 里复制。
        shell: bash
        working-directory: daedalus-core
        run: |
          just plugin-pack
          test -x files/system/usr/local/bin/daedalus-shell

      - name: Deno Test Suite
        # copilot 测试套件(含 shellpolicy_contract 跨语言契约,读 ../daedalus-sdk)。
        shell: bash
        working-directory: daedalus-core
        run: deno test --allow-all tests/deno/

      - name: i18n Keys Gate
        # i18n 键集门禁:en↔zh 对称 + t() 字面量双 locale 存在性。
        shell: bash
        working-directory: daedalus-core
        run: bash tests/deno/i18n_keys.test.sh

      - name: copilot install-state reproducibility gate
        # 安装态 files/system/opt/daedalus/plugins/daedalus.copilot/ 已
        # 加进 .gitignore,本地开发者无需 commit。CI 这里验证 pack 脚本
        # **幂等性** —— 跑两次产出的安装态 sha256 必须一致(说明产物可
        # 重现 + 源码状态未漏 re-pack)。原「git status 漂移」门被设计成
        # 强制 commit 构建产物(违背 12-factor),本 gate 取代之。
        shell: bash
        working-directory: daedalus-core
        run: |
          hash_install_state() {
              find files/system/opt/daedalus/plugins/daedalus.copilot/ \
                  -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null \
                  | sha256sum
          }
          just copilot-plugin
          FIRST="$(hash_install_state)"
          just copilot-plugin
          SECOND="$(hash_install_state)"
          if [ -n "$FIRST" ] && [ "$FIRST" != "$SECOND" ]; then
            echo "ERROR: pack-copilot-plugin.sh is not idempotent (two runs produced different sha256)"
            echo "  run1: $FIRST"
            echo "  run2: $SECOND"
            echo "  → pack 脚本需保证重复跑产出一致(时间戳 / 随机数 / sort 顺序等不能进入产物)"
            exit 1
          fi
          if [ -z "$FIRST" ]; then
            echo "ERROR: pack-copilot-plugin.sh 没产出任何文件(files/system/opt/.../daedalus.copilot/ 为空)"
            echo "  → pack 脚本要么跳过 (check CI 环境与源码 plugin/copilot/ 是否就位),要么写错了输出路径"
            exit 1
          fi
          echo "OK: copilot install state is reproducible (sha256=$FIRST)"

      - name: testdata drift gate (production policy.toml ↔ SDK testdata)
        # 生产 policy.toml 与 SDK 的 testdata 副本必须
        # 一致,否则 SDK 的 3 点漂移测试校验的是过期副本。不一致即 fail。
        shell: bash
        working-directory: daedalus-core
        run: |
          diff files/system/opt/daedalus/shared/policy.toml ../daedalus-sdk/policy/testdata/policy.toml
          echo "OK: 生产 policy.toml 与 SDK testdata 一致"

      - name: Real-machine verifier preflight
        # 钉住 runner 仍满足 x86-64-v3(AlmaLinux 10 glibc 硬要求)。GitHub 标准 runner 无
        # /dev/kvm,故只降级 KVM 一项;引导验证腿仍在真机跑(bootc-verify.sh 无参数模式)。
        shell: bash
        working-directory: daedalus-core
        run: bash tests/real-machine/bootc-verify.sh --only-preflight --no-kvm

      - name: Checkout daedalus-agent (sibling)
        # 第四个兄弟仓:仅下方的 workflow 凭据不变式守门需要它(该守门要读四仓的
        # workflow 文件,而只有本 job 同时检出四个仓 —— 同 policy.toml drift 守门的选址理由)。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Daedalusys/daedalus-agent
          path: daedalus-agent

      - name: CI gate selftests (script self-checks)
        # 门禁脚本自身的逻辑也要被验证:否则「改断言」这一步不可验证,脚本退化
        # (少跑一条断言、判定函数变瞎)不会被任何东西发现。
        # workflow-hygiene.sh 的 selftest 在它自己的步骤里跑(与真实扫描同处)。
        # release-promote-test.sh 把两条发布腿的 run 块抽出来用假 gh 驱动 —— 那些腿
        # 只在出货档触发,不在这里守的话就只能等下一次真出货才发现退化。
        shell: bash
        working-directory: daedalus-core
        run: |
          bash tests/build/image-lint.sh --selftest
          bash tests/ci/credential-surface-check.sh --selftest
          bash tests/ci/release-asset-name-test.sh
          bash tests/ci/release-promote-test.sh

      - name: Workflow hygiene gate (cross-repo credential invariants)
        # 四仓 workflow 的 persist-credentials / cache / SHA 钉版不变式集中在此守门:
        # 只有本 job 同时检出四个兄弟仓(同 policy.toml drift 守门的选址理由)。
        # 注意 SDK 的检出 ref:go.mod 是占位版本(v0.0.0)时为空 → 扫 SDK 默认分支;
        # 一旦 go.mod 钉了真实 SDK 版本,本门禁扫的就是**那个 tag 的** workflow 内容,
        # 即"绿"意味着"该 tag 合规"而非"SDK main 合规"。
        shell: bash
        working-directory: daedalus-core
        run: |
          bash tests/ci/workflow-hygiene.sh --selftest
          bash tests/ci/workflow-hygiene.sh

  # 镜像构建与发布:main 分支 / feat/* 分支 / 任何 tag / workflow_dispatch 才跑。
  # 依赖 test 通过;PR 与普通分支 push 不到此处,反馈快。
  # main 纳入的意义:PR 上的绿是合并前分支头的绿,合并后的组合此前从未被真正构建成
  # 镜像(2026-10-21 靠手动 dispatch 才验到 #48+#49 的合并态)。
  # 跨仓集成:daedalus-plugins 的 release zip 在此 job 内联下载,解压到镜像树
  # 安装态后 `just build` 构建镜像。
  build-image:
    name: Build & Publish Daedalus Image
    runs-on: ubuntu-24.04
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/tags/') }}
    # 升级 packages:write 权限(仅本 job 需要;ghcr.io 推送)。
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [headless]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 同 test job:主仓检出到 daedalus-core 子目录,不逃出 GITHUB_WORKSPACE。
          path: daedalus-core

      - name: Extract SDK version from go.mod
        # 同 test job:pinned-tag 策略,SDK checkout 的 ref 从 go.mod 提取;
        # 占位版本 v0.0.0 或缺失时输出空 sdk_version,SDK checkout 走默认分支。
        id: sdk-version
        shell: bash
        working-directory: daedalus-core
        run: |
          SDK_VERSION=$(sed -n 's/.*daedalus-sdk v\([0-9.]*\).*/\1/p' go.mod | head -1)
          if [ -z "$SDK_VERSION" ] || [ "$SDK_VERSION" = "0.0.0" ]; then
            echo "占位版本或版本缺失($SDK_VERSION);输出空 sdk_version,SDK checkout 走默认分支" >&2
            SDK_VERSION=""
          fi
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout daedalus-sdk (sibling, pinned tag)
        # 同 test job:SDK 检出到 workspace 下的 daedalus-sdk 子目录;ref 为空
        # (go.mod 为占位版本)时 checkout 默认分支。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Daedalusys/daedalus-sdk
          path: daedalus-sdk
          ref: ${{ steps.sdk-version.outputs.sdk_version != '' && format('v{0}', steps.sdk-version.outputs.sdk_version) || '' }}

      - name: Set up Podman / Buildah
        shell: bash
        working-directory: daedalus-core
        run: |
          sudo apt-get update -y || true
          # qemu-user-static 在 Ubuntu 26.04 (resolute) 后更名为
          # qemu-user-binfmt-hwe 或 qemu-user-binfmt;原包名是 virtual package
          # 已无 installation candidate。amd64-only build 不需要 qemu,先按
          # 暂存在的 fallback 装以避免虚拟包报错中断。
          sudo apt-get install -y podman just
          sudo apt-get install -y qemu-user-binfmt-hwe || \
            sudo apt-get install -y qemu-user-binfmt || \
            echo "WARN: no qemu-user-binfmt available; \
              cross-arch build unsupported"

      - name: Set Up Go Toolchain
        # 主仓在 daedalus-core 子目录,缓存依赖文件路径须带前缀。
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          # 同 test job:本文件的 workflow 由 pull_request 触发,故文件内所有
          # setup-go 一律 cache: false(见 test job 处的说明)。
          cache: false
          cache-dependency-path: daedalus-core/go.sum

      - name: Prepare justfile.local (gitignored stub for import)
        # 同 test job:CI clone 出来没有 justfile.local,just 解析会 fail。
        # 必须先于第一个 `just` 调用(下方 Build Core Binaries)执行。
        shell: bash
        working-directory: daedalus-core
        run: |
          touch justfile.local
          ls -la justfile.local

      - name: Build Core Binaries (Go)
        # 构建 core 仓全部 Go 静态二进制到 bin/(拆仓后 ./cmd/... 仅 5 个:
        # daedalus-host / daedalus-audit / daedalus-tx / daedalus-smoke /
        # daedalus-plugin-pack;shell/service 主源在 daedalus-plugins 仓)。
        shell: bash
        working-directory: daedalus-core
        run: just go-build

      - name: Download plugin zips from daedalus-plugins release
        # 镜像构建 job 内联 plugin zip 下载(跨仓集成)。
        # daedalus-plugins 仓 release 出 11 个 *.plugin.zip(fs/shell/pkg/sysinfo/
        # service/blueprint/dupe/diskclean/organize/trace/proc);gh 在 runner 预装且
        # 经 GITHUB_TOKEN 认证。fetch-plugins.sh 只做本地等价兜底,
        # 不重复描述本 workflow 步骤。下载目录用绝对路径 /tmp,不受 cwd 影响。
        shell: bash
        working-directory: daedalus-core
        run: |
          mkdir -p /tmp/plugins-release
          gh release download --repo Daedalusys/daedalus-plugins --pattern '*.plugin.zip' --dir /tmp/plugins-release/
          ls -la /tmp/plugins-release/

      - name: Unpack plugin zips into image tree install state
        # 解压即校验(daedalus-plugin-pack -verify --keep):任一 checksum 不符
        # 拒绝安装(fail-closed)。安装态落 files/system/opt/daedalus/plugins/,
        # 经 just build 的 sync 腿同步进镜像 /opt/daedalus/plugins。
        shell: bash
        working-directory: daedalus-core
        run: |
          for zip in /tmp/plugins-release/*.plugin.zip; do
            id=$(basename "$zip" .plugin.zip)   # daedalus.fs / daedalus.shell / ...
            dest="files/system/opt/daedalus/plugins/$id"
            mkdir -p "$dest"
            find "$dest" -mindepth 1 -delete
            ./bin/daedalus-plugin-pack -verify "$zip" --keep "$dest"
            echo "unpacked: $id"
          done

      - name: Install core binaries to image tree
        # files/system/usr/local/bin/ 下的 daedalus-{host,audit,tx,smoke,shell,service}
        # 全是 just plugin-pack 构建产物、不入库,故 CI 在此自行落位:host/audit/tx/smoke
        # 取 core 新鲜构建产物;shell/service 取上方 release zip 解包态(files/system/opt/
        # daedalus/plugins/daedalus.{shell,service}/bin/),与插件安装态逐字节同源。
        # 76-daedalus-plugin-gen.sh 与 copilot wrapper 的 deno --allow-run 放行路径、
        # 以及镜像内以字面路径直启的 QA 链路都依赖这些位置,缺失即 fail-closed。
        #
        # smoke 是 QA 链路专用(镜像内端到端自检),**不参与** systemd 单元渲染 ——
        # 76-daedalus-plugin-gen.sh 只认插件 manifest 里声明的 capability 二进制。
        shell: bash
        working-directory: daedalus-core
        run: |
          install -Dm0755 bin/daedalus-host files/system/usr/local/bin/daedalus-host
          install -Dm0755 bin/daedalus-audit files/system/usr/local/bin/daedalus-audit
          install -Dm0755 bin/daedalus-tx files/system/usr/local/bin/daedalus-tx
          install -Dm0755 bin/daedalus-smoke files/system/usr/local/bin/daedalus-smoke
          for cap in shell service; do
            src="files/system/opt/daedalus/plugins/daedalus.${cap}/bin/daedalus-${cap}"
            if [ ! -x "${src}" ]; then
              echo "ERROR: 插件解包态缺少 ${src}" >&2
              exit 1
            fi
            install -Dm0755 "${src}" "files/system/usr/local/bin/daedalus-${cap}"
          done

      - name: Build Daedalus Container Image
        # just build = sync(scripts/sync-daedalus.sh 把 files/ 同步进 base_image
        # vendor 树,CI 上从 AlmaLinux/atomic-desktop 浅克隆 bootstrap)+ podman build。
        # 镜像内 76-daedalus-plugin-gen.sh 从安装态渲染 systemd ExecStart 并自校验。
        # DAEDALUS_FETCH_ZIP_DIR:上方步骤已把 release zip 下到 /tmp/plugins-release,
        # fetch-plugins 腿经 --local-zip-dir 复用(gh download 拒覆盖同名文件),
        # 解压即校验语义不变。
        shell: bash
        working-directory: daedalus-core
        env:
          DAEDALUS_FETCH_ZIP_DIR: /tmp/plugins-release
        run: just build

      - name: Verify plugin inventory in image
        # 镜像里的插件清单必须**恰好**是「CAPS + copilot」且无 degraded —— 「有 manifest
        # 没二进制」的插件在这一步暴露(core#53 的原始形态)。期望集合从 76 脚本的 CAPS
        # 派生(不写死数量/名单);list 输出的解析与比对在脚本内,自带 --selftest。
        shell: bash
        working-directory: daedalus-core
        run: ./tests/build/plugin-inventory-image.sh

      - name: Verify Image Zero-Residue
        # 断言镜像 /opt 内无 Python 源码/字节码、__pycache__、Deno 测试文件、
        # Go 模块/依赖残留。任一新布局构建产物泄漏进 rootfs 即 exit 1。
        shell: bash
        working-directory: daedalus-core
        run: |
          podman run --rm localhost/daedalus-os:latest sh -c 'test -z "$(find /opt -name "*.py" -o -name "*.pyc" -o -name "__pycache__" -o -name "*.test.ts" -o -name "go.mod" -o -type d -name vendor 2>/dev/null)"' || { echo "ERROR: residue found in image /opt"; exit 1; }

      - name: Verify Image Bootc Lint And Variant
        # 构建期 lint 在 Containerfile 末尾(`RUN bootc container lint`);本步是最终态
        # 复验:从「以该镜像起一个容器」的视角再跑一次 lint,并补上构建期没验的两项 ——
        # /etc/os-release 的 VARIANT=headless 标记(daedalus-host rescue 与
        # headless-variant.sh 共同依赖的契约)与宿主 CLI 的可执行性。
        # 二者不重复的原因:构建期 lint 判的是**构建过程**里的镜像(它一挂,`just build`
        # 就挂,连本步都到不了);本步判的是**CI 即将推送的那一盘**,且独立于构建腿 ——
        # 失败时「镜像在运行时起不来」这件事归本步名下,而不是埋进 build 日志里。
        # 此前本步是两条 `podman run … || true` + 一句 echo,恒绿且什么也没判定
        # (core#60 假绿清单之一)。
        shell: bash
        working-directory: daedalus-core
        run: ./tests/build/image-lint.sh localhost/daedalus-os:latest

      - name: Headless deployment probes (systemd-in-container)
        # 在真容器里跑 A–F 行为探针:镜像能不能起 systemd、控制器能不能动、
        # 审计链在不在、smoke 过不过。此前整条产线只验「镜像构建成功」,
        # 从不验「镜像起不来」——本步把后者变成门禁。
        # x86-64-v3 前置:镜像内 glibc 硬性要求;runner CPU 不满足时**响亮失败**,
        # 绝不静默跳过(跳过 = 假绿,正是本仓要消灭的形态)。
        shell: bash
        working-directory: daedalus-core
        env:
          REMOTE_HOST: local
          LOG_DIR: ${{ runner.temp }}/daedalus-headless-logs
        run: |
          missing=""
          for f in avx2 bmi1 bmi2 fma movbe xsave; do
            grep -qw "$f" /proc/cpuinfo || missing="$missing $f"
          done
          [ -z "$missing" ] || { echo "ERROR: runner CPU 不支持 x86-64-v3,缺:$missing"; exit 1; }
          bash tests/deploy/headless-test.sh localhost/daedalus-os:latest

      # ---- 发布:OCI 镜像 → ghcr.io (bootc 原生分发形态),按 ref 分两档 ----
      #   :<sha>          —— 每次成功构建都推(build-qcow2 按它取本 run 的镜像);
      #   :latest/:upstream —— 只有 main / tag / dispatch(PUSH=true) 才写。
      # job 级 if: 已限定到 main / feat/* / tag / workflow_dispatch;此处再过滤
      # workflow_dispatch.PUSH=false 的纯构建(只构建+验证不推)场景。
      - name: Log in to ghcr.io
        # GITHUB_TOKEN 自动注入,无需手动 secret
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.PUSH }}
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI image to ghcr.io
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.PUSH }}
        shell: bash
        working-directory: daedalus-core
        env:
          OWNER_LOWER: ${{ github.repository_owner }}
        run: |
          # repository_owner 可能含大写,ghcr 要求全小写路径
          IMAGE="ghcr.io/${OWNER_LOWER,,}/daedalus-os"
          podman tag localhost/daedalus-os:latest "${IMAGE}:${{ github.sha }}"
          # ghcr 对「同 digest 层已存在于其他不可见私有包」的 blob HEAD 复用探测会返回
          # 403(而非 404),podman 视为致命错误直接 exit 125(run 35757330443
          # attempt 4/5 在 899f820c… 层稳定复现)。用 zstd 重压缩推送 → 所有层
          # digest 全新 → HEAD 一律 404 → 正常上传。本地镜像不受影响,
          # 仅改变推送时的压缩格式。
          podman push --compression-format zstd "${IMAGE}:${{ github.sha }}"
          echo "Pushed: ${IMAGE}:${{ github.sha }}"

      - name: Promote image to :latest and :upstream
        # 出货档:main 与 tag 是既成事实,dispatch 需显式 PUSH=true(input 默认 false)。
        # feat/* 分支 push 在此判为 false → 只留 :<sha>,未合并的分支不再能改写
        # "最新镜像"(:latest / :upstream 原先被 feat/* 每次 push 覆盖)。
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.PUSH) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
        shell: bash
        working-directory: daedalus-core
        env:
          OWNER_LOWER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${OWNER_LOWER,,}/daedalus-os"
          # 上一步已把同一镜像落成 :<sha>,这里只是给它加两个别名;层已在同仓内,
          # 推送只补 manifest。
          podman tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest"
          podman push --compression-format zstd "${IMAGE}:latest"
          # :upstream 是 bootc 原地升级 (KVM guest 上 `bootc upgrade ghcr.io/<owner>/daedalus-os:upstream`)
          # 的稳定别名,与 :latest/:sha 共存,指向同一镜像内容。
          podman tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:upstream"
          podman push --compression-format zstd "${IMAGE}:upstream"
          echo "Promoted: ${IMAGE}:latest + ${IMAGE}:upstream"


  # 独立 job:qcow2 是交付产物,不是合并门。上游 bootc-image-builder 在 2026-10 中旬
  # 重建(源码迁到 osbuild/image-builder,镜像改为 CS10 image-builder RPM 封装),
  # 本 job 跟 :latest,当前挂在 builder 内部 osbuild 挂载 —— 见 issue #50。
  # 它挂掉只红自己,不阻断上面的镜像构建 + lint + 发布腿。
  build-qcow2:
    name: Build qcow2 disk image (bootc-image-builder)
    # ★ 钉死 ubuntu-24.04,不用 ubuntu-latest(见 issue #50)。
    #
    # 起因:`ubuntu-latest` 在 2026-10 中下旬从 24.04 漂到了 26.04(runner image
    # 20261012.163.1),同一窗口内 osbuild 在 builder 容器里的嵌套挂载开始被拒:
    #   RuntimeError: mount: /run/osbuild/containers/storage: permission denied (code 32)
    # code 32 是 EPERM 而非 EACCES,配合前面那串
    #   fchownat() of /var/log/{wtmp,btmp,lastlog} failed: Operation not permitted
    # 全是宿主侧拦截,与 daedalus-os 镜像内容无关 —— `--privileged` 没能豁免。
    #
    # 用 `ubuntu-latest` 意味着 CI 行为随 GitHub 的发布节奏漂移,踩坑时无从追溯。
    # 24.04 是 LTS,生命周期长于本项目,故钉版本而非追latest。
    # 升级 runner 时需回归 build-qcow2 这条腿。
    runs-on: ubuntu-24.04
    needs: build-image
    # 只在"确实要出货"的场景跑:main push、tag push,或手动 dispatch 且 PUSH=true。
    # 排除 pull_request 与 feat/* 分支 push —— 出货腿红点不该被当成 PR 的合并门。
    # 该腿曾有宿主侧拦截的历史失败(runner 漂移),已由钉 ubuntu-24.04 修掉。
    if: ${{ !cancelled() && needs.build-image.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.PUSH) || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    # contents:write 只为末尾的「晋级到 Release」那一步(gh release create/upload
    # 走 GITHUB_TOKEN)。本 job 跑在 GitHub 托管的 ubuntu-24.04 上、不执行仓库脚本
    # 之外的任何自带代码,故提权面就是这条腿自己;绝不下放到 workflow 级 ——
    # 其余 job 与 PR 触发路径都只需 read。
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout repository
        # 晋级步骤要用 scripts/release-asset-name.sh(资产命名规则的单一事实源)
        # 并用 git 解出本次 commit 的短 sha,故本 job 也必须检出仓库。
        # 布局同其它 job:检出到 daedalus-core 子目录,不逃出 GITHUB_WORKSPACE。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: daedalus-core

      - name: Set up Podman
        shell: bash
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y podman

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image for this commit
        # 按 <sha> tag 取本 run 刚推的镜像,省掉跨 job 的 OCI archive 大文件手递。
        shell: bash
        env:
          OWNER_LOWER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${OWNER_LOWER,,}/daedalus-os"
          podman pull "${IMAGE}:${{ github.sha }}"
          podman tag "${IMAGE}:${{ github.sha }}" localhost/daedalus-os:latest

      - name: Export OCI archive (rootless → rootful handoff)
        # bootc-image-builder 的 --local 模式硬性要求 rootful podman
        # ("this command must be run in rootful"),而 Actions 的构建在
        # rootless 存储里。用 save/load 把镜像从用户存储转交 root 存储。
        shell: bash
        run: podman save --format oci-archive -o /tmp/daedalus-os.oci.tar localhost/daedalus-os:latest

      - name: Build qcow2 disk image (bootc-image-builder, rootful)
        shell: bash
        run: |
          sudo podman load -i /tmp/daedalus-os.oci.tar
          mkdir -p output/qcow2
          # rootful podman 的存储在 /var/lib/containers/storage(load 已导入),
          # builder 容器内硬编码该路径找镜像 → 同名对同名挂载(root 存储进容器)。
          sudo podman run --rm \
            --privileged \
            --security-opt label=disable \
            -v "$PWD/output/qcow2:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --local --type qcow2 --output /output localhost/daedalus-os:latest
          # builder 以 root 写产物,归还属主给 runner 用户(artifact 上传需要)
          sudo chown -R "$(id -u):$(id -g)" output/qcow2
          ls -lh output/qcow2/

      - name: Upload qcow2 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daedalus-os-qcow2-headless
          # 限额说明:qcow2 实测约 1.3GB,artifact 上限 10GB;挂 Release 时的硬限
          # 是单文件 2GiB —— 那条闸在 scripts/release-asset-name.sh 里(超限退出码 2,
          # 明确失败而非静默跳过)。artifact 默认保留 90 天,Release 资产长期可引用。
          path: output/qcow2/
          if-no-files-found: error
          compression-level: 0

      - name: Promote qcow2 to GitHub Release
        # 只对出货档上传:PR 与 feat/* 分支绝不写 Release(job 级 if 已过滤,这里
        # 再挡一次,免得将来有人把 job 的 if 放宽)。本 job 在 GitHub 托管的
        # ubuntu-24.04 上跑,contents:write 只在本 job 内授予。
        #
        # 用 success() 而不是 !cancelled():后者的字面意思是"前一步挂了也继续"。
        # 对发布腿而言那正是要避免的 —— 产物没通过前面的构建/上传链路就不该进
        # Release,否则会出现"前面红、发布绿"的假绿,让人以为这一版发成功了。
        # (GitHub Actions 里 if 一旦写了状态检查函数,隐式的 success() 就失效,
        # 所以必须显式写出来;括号不能省,否则 || 会把 success() 短路掉。)
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.PUSH) || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        shell: bash
        working-directory: daedalus-core
        env:
          GH_TOKEN: ${{ github.token }}
          # 无 tag 的出货档(dispatch / main push)用短 sha 当版本标识,与
          # release-asset-name.sh 的规则同源;有 tag 时用 tag 名。
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$(git rev-parse --short=12 HEAD)}"
          # 晋级的就是本 job 刚构建的那一份($GITHUB_WORKSPACE/output/qcow2 之下,
          # 与上方 artifact 上传同源),**不重新构建** —— 被验证的产物与被发布的
          # 产物必须是同一份字节。
          qcow2="$(find "$GITHUB_WORKSPACE/output/qcow2" -name '*.qcow2' -type f | head -1)"
          [ -n "$qcow2" ] || { echo "ERROR: 没有 qcow2 可晋级(发布腿不得在产物缺失时静默跳过)"; exit 1; }
          name="$(bash scripts/release-asset-name.sh qcow2 "$qcow2")"
          # 资产名里的版本必须等于 Release tag:两处规则一旦漂开,"按这个 URL 拉"
          # 就会拉到对不上的东西。
          case "$name" in "qcow2-${tag}."*) ;; *) echo "ERROR: 资产名 $name 与 Release tag $tag 不一致"; exit 1 ;; esac
          # 资产名取的是**上传的文件名**:gh release upload 的「路径#标签」只设 label,
          # 资产名仍是原文件名(实测:label=qcow2-<ver>.qcow2 而 name=disk.qcow2)。
          # 故先按目标名在临时目录落一份再上传 —— 文件名必须**恰好**是资产名,
          # 故落位目录单独开一个,不给文件名加前缀;同文件系统用硬链接(零拷贝),
          # 跨设备退化为复制。临时目录不碰产物目录,免得污染 artifact 上传的输入。
          stagedir="${RUNNER_TEMP:?RUNNER_TEMP 未设置}/daedalus-release"
          mkdir -p "$stagedir"
          staged="$stagedir/$name"
          rm -f "$staged"
          ln "$qcow2" "$staged" 2>/dev/null || cp "$qcow2" "$staged"
          trap 'rm -f "$staged"' EXIT
          # --target 把 tag 钉在本 run 的 commit 上:不给它,gh 会把新 tag 建在默认
          # 分支当时的头上,于是"货"与 tag 未必对得上。
          # Release 已存在时必须确认它指向的就是本 run 的 commit —— 绝不在"指向
          # 别人的 commit 的 Release"上补资产,那会造出跨 commit 的混合发布。
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha || true)"
            if [ -z "$existing" ]; then
              echo "ERROR: Release $tag 已存在,却读不回它指向的 commit,拒绝在上面补资产" >&2
              exit 1
            fi
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "ERROR: Release $tag 指向 $existing,不是本次 run 的 $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Release $tag 已存在且指向本 run 的 commit:只补同名资产"
          else
            # 另一条腿可能在同一瞬间建同一个 tag:建失败但 Release 已存在,即视为成功
            # (幂等),否则两条腿会因竞态随机红一条。
            gh release create "$tag" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "daedalus-os $tag" \
              || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || { echo "ERROR: 创建 Release $tag 失败" >&2; exit 1; }
          fi
          # --clobber:同一 ref 重跑 workflow 时覆盖同名资产,而不是报 already exists 变红
          gh release upload "$tag" "$staged" --clobber --repo "$GITHUB_REPOSITORY"
          echo "已晋级 Release 资产: $name"

  # 真机引导门禁:qcow2 在真 KVM 上起起来,串口必须出现 login 提示符。
  # 此前 qcow2 只产出不引导——「镜像能不能起来」这件事从未被任何 CI 判过。
  deploy-verify-kvm:
    name: Deploy Verify (real KVM boot)
    # 跑在自托管 runner 上(标签 daedalus-kvm):必须是 x86-64-v3 且有 /dev/kvm,
    # 否则 AlmaLinux 10 的 glibc 会在 guest 里 panic。
    # 只对出货档开放(main / tag / dispatch(PUSH=true)):自托管 runner 会执行
    # 构建产物,PR 与 feat/* 分支绝不触发——这是安全底线,不是省时间。
    runs-on: [self-hosted, linux, x64, daedalus-kvm]
    needs: build-qcow2
    if: ${{ !cancelled() && needs.build-qcow2.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.PUSH) || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    # 单 runner 约束:三条实机腿在 DAG 上并行,但只有一台自托管 runner,而排队时间
    # **计入** 本 job 的 timeout-minutes。三条腿各跑 20–40 分钟,后两条最坏要等前面的
    # 跑完才轮到 —— 原来的 45/60 分钟会把还没轮到的腿判成 cancelled(2026-11-06 实测:
    # 一次 run 里 deploy-verify-kvm 与 deploy-verify-bootc-switch 双双被判 cancelled)。
    # 故统一抬到 180 分钟,只当"卡死"的兜底:腿真失败会立刻红,不会等满。
    # 刻意**不改** needs: —— 不串成依赖链,是为了让一条腿红时另外两条仍各跑各的,
    # 诊断信息不丢(串起来会让后面的腿被 skip)。
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: daedalus-core

      - name: Download qcow2 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: daedalus-os-qcow2-headless
          path: ${{ github.workspace }}/qcow2

      - name: Boot the qcow2 in KVM and wait for login prompt
        shell: bash
        working-directory: daedalus-core
        env:
          VERIFY_WORK: ${{ github.workspace }}/verify-out
        run: |
          qcow2="$(find "${{ github.workspace }}/qcow2" -name '*.qcow2' -type f | head -1)"
          [ -n "$qcow2" ] || { echo "ERROR: artifact 里没有 .qcow2"; exit 1; }
          # sudo 会清环境变量,VERIFY_WORK 必须显式透传
          sudo VERIFY_WORK="$VERIFY_WORK" bash tests/real-machine/bootc-verify.sh --qcow2 "$qcow2"

      - name: Upload boot evidence
        # 引导失败时证据照样回传:串口日志是排查 panic 的唯一线索。
        # 前置就失败时目录可能压根没建出来,所以用 warn 而不是 error——
        # 「证据上传」不该变成第二个失败源。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-verify-kvm-evidence
          path: ${{ github.workspace }}/verify-out
          if-no-files-found: warn
          retention-days: 30

  # bootc 部署链门禁:在真 KVM 里验证「换部署 + 回滚」真的生效。
  # 与 deploy-verify-kvm 的分工 —— 那条只验「能引导到 login 提示符」(第一跳);
  # 本条验「能切到别的部署、能回滚回来」(第二、三跳)。产品的「原子更新 + 一键回滚」
  # 主张此前零证据,这条是它唯一的实机判据;判定用部署 digest + 内容 marker 双重证据,
  # 不接受「命令返回 0 就算过」。
  deploy-verify-bootc-switch:
    name: Deploy Verify (bootc switch + rollback)
    # 与 deploy-verify-kvm 同宿主同标签:两者会在这台 runner 上串行(每条约 20 分钟)。
    # 同样只对出货档开放 —— 自托管 runner 会执行构建产物,PR 与 feat/* 绝不触发。
    runs-on: [self-hosted, linux, x64, daedalus-kvm]
    needs: build-image
    if: ${{ !cancelled() && needs.build-image.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.PUSH) || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    # timeout 说明见 deploy-verify-kvm 处的注释:单 runner 下排队时间计入 timeout,
    # 三条腿统一 180 分钟,只当卡死兜底。needs 刻意不串成链:一条腿红不影响另外两条。
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: daedalus-core

      - name: "KVM: boot -> bootc switch -> bootc rollback"
        # 脚本自己会派生一次性 verify 镜像(复刻 78-dev-user.sh 的凭据注入)——
        # 发布镜像本身没有登录账号,而 switch/rollback 必须在 guest 内执行。
        # 该派生镜像只在本地存在:不推 registry、不进发布产物、密码随机用完即弃。
        shell: bash
        working-directory: daedalus-core
        env:
          VERIFY_WORK: ${{ github.workspace }}/switch-verify
        run: |
          # 验的就是本 run 刚构建的镜像(按 :<sha> 取)
          IMAGE="ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/daedalus-os:${{ github.sha }}"
          sudo VERIFY_IMAGE="$IMAGE" VERIFY_WORK="$VERIFY_WORK" \
            bash tests/real-machine/bootc-switch-verify.sh

      - name: Upload switch/rollback evidence
        # 失败时证据照样回传:三次引导的串口日志 + 完整日志是唯一线索。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-verify-bootc-switch-evidence
          path: ${{ github.workspace }}/switch-verify
          if-no-files-found: warn
          retention-days: 30

  # ISO 交付形态门禁:产出 ISO 并验证它真能引导到安装器。
  # 此前 `just iso`(legacy `bootc-image-builder --type iso`)根本构建不出 ISO ——
  # osbuild 每个包下载都失败,上游已把该 image type 标为 legacy 不再支持(core#84)。
  # 本条走官方推荐的新 CLI + generic-iso,并把 ISO 载荷补在**一次性派生镜像**里 ——
  # 发布产物一格不动,故 qcow2 与其它门禁零影响。
  deploy-verify-iso:
    name: Deploy Verify (ISO boot + unattended install)
    # 与 deploy-verify-kvm / deploy-verify-bootc-switch 同宿主同标签,会串行;同样
    # 只对出货档开放 —— 自托管 runner 会执行构建产物。
    #
    # 判据(rev-2,依据 Task 1 探查结论):
    #   段一 P2-2a(本 job 的绿线):ISO 引导出的 live 系统可用,用 SSH 自证 ——
    #     hostfwd 2222 登入 → 根确为 live 介质 → 系统就是本镜像。live 内核参数没有
    #     console=ttyS0,串口不可能有输出,所以判据只能落在 SSH 上。
    #   段二 P2-2b(默认硬判据):live 环境里的 oneshot 单元对空虚拟盘 bootc install to-disk,
    #     装完重启 → 引导该盘 → 串口 login: + 目标盘分区表。**这条腿必须绿**:
    #     脚本默认 VERIFY_REQUIRE_INSTALL=1,本 job 也显式写死 1(出货档不允许用 LIVE_OK 掩盖
    #     装机链退化);只有本地排查段一时才临时设 0。
    #   注意:"可引导到安装器菜单"这种判据已被证明是假绿 —— generic-iso 不消费 blueprint
    #   (传了也静默忽略),而且它根本不是安装器,只是 payload 容器 rootfs 的 live ISO;
    #   探针证据见 docs/superpowers/plans/notes/2026-11-06-iso-blueprint.md。
    runs-on: [self-hosted, linux, x64, daedalus-kvm]
    needs: build-image
    if: ${{ !cancelled() && needs.build-image.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.PUSH) || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    timeout-minutes: 180
    # contents:write 只为末尾的「晋级到 Release」那一步(gh release create/upload
    # 走 GITHUB_TOKEN)。本 job 跑在**自托管** runner 上、以 sudo 执行仓库脚本
    # (构建产物 + 派生镜像都会落地),故这条提权只在本 job 内授予,且 job 级 if
    # 已把触发面限死在出货档(main / tag / dispatch 且 PUSH=true)—— PR 与
    # feat/* 分支一律不进来。绝不下放到 workflow 级。
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: daedalus-core

      - name: "ISO: derive payload -> generic-iso -> live SSH 自证 + 无人值守装机"
        shell: bash
        working-directory: daedalus-core
        env:
          VERIFY_WORK: ${{ github.workspace }}/iso-verify
          # 出货档必须验到「装完能引导到 login:」:段二(P2-2b)是硬判据,不允许
          # 用 LIVE_OK 掩盖装机链退化(autoinstall 单元 / kernel args / payload 的
          # dmsquash-live 任何一处坏掉都必须红)。脚本自身的默认值也是 1,
          # 这里显式写出来是为了让「出货档必须硬门禁」这件事在 workflow 里可见、可审。
          VERIFY_REQUIRE_INSTALL: "1"
        run: |
          IMAGE="ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/daedalus-os:${{ github.sha }}"
          sudo VERIFY_IMAGE="$IMAGE" VERIFY_WORK="$VERIFY_WORK" \
            bash tests/real-machine/iso-verify.sh

      - name: Upload ISO verify evidence
        # 失败时证据照样回传:串口日志是判断「引导到哪一步」的唯一线索。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-verify-iso-evidence
          path: ${{ github.workspace }}/iso-verify
          if-no-files-found: warn
          retention-days: 30

      - name: Promote ISO to GitHub Release
        # 与 build-qcow2 那条腿同型:只对出货档上传,提权只在 job 内、只在出货 ref 上。
        # success() 不能省:这条腿前面正是 **ISO 的引导验证**,而 iso-verify.sh 引导
        # 失败时 exit 1 但 ISO 文件仍在盘上 —— 用 !cancelled() 会把一个没通过验证的
        # ISO 发出去,且发布步骤显示绿。括号同样不能省(见另一条腿的说明)。
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.PUSH) || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        shell: bash
        working-directory: daedalus-core
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          # 与上方构建步骤同一个工作目录:晋级的就是这一条腿刚刚验证过的那份 ISO。
          VERIFY_WORK: ${{ github.workspace }}/iso-verify
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$(git rev-parse --short=12 HEAD)}"
          # iso-verify.sh 的产物落在 $VERIFY_WORK/output 下,不重新构建 ——
          # 被验证的那份 ISO 与被发布的 ISO 必须是同一份字节。
          iso="$(find "$VERIFY_WORK/output" -name '*.iso' -type f | head -1)"
          [ -n "$iso" ] || { echo "ERROR: 没有 ISO 可晋级(发布腿不得在产物缺失时静默跳过)"; exit 1; }
          name="$(bash scripts/release-asset-name.sh iso "$iso")"
          # 资产名里的版本必须等于 Release tag,否则"按这个 URL 拉"会拉到对不上的东西
          case "$name" in "iso-${tag}."*) ;; *) echo "ERROR: 资产名 $name 与 Release tag $tag 不一致"; exit 1 ;; esac
          # 资产名取的是**上传的文件名**(gh release upload 的「路径#标签」只设 label,
          # 见 build-qcow2 那条腿的说明),故先按目标名在临时目录落一份再上传 ——
          # 文件名必须恰好是资产名,故单独开一个落位目录、不加前缀。
          stagedir="${RUNNER_TEMP:?RUNNER_TEMP 未设置}/daedalus-release"
          mkdir -p "$stagedir"
          staged="$stagedir/$name"
          rm -f "$staged"
          ln "$iso" "$staged" 2>/dev/null || cp "$iso" "$staged"
          trap 'rm -f "$staged"' EXIT
          # Release 已存在时必须确认它指向的就是本 run 的 commit(理由见 qcow2 那条腿)。
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha || true)"
            if [ -z "$existing" ]; then
              echo "ERROR: Release $tag 已存在,却读不回它指向的 commit,拒绝在上面补资产" >&2
              exit 1
            fi
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "ERROR: Release $tag 指向 $existing,不是本次 run 的 $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Release $tag 已存在且指向本 run 的 commit:只补同名资产"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "daedalus-os $tag" \
              || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || { echo "ERROR: 创建 Release $tag 失败" >&2; exit 1; }
          fi
          # --clobber:同一 ref 重跑 workflow 时覆盖同名资产,而不是报 already exists 变红
          gh release upload "$tag" "$staged" --clobber --repo "$GITHUB_REPOSITORY"
          echo "已晋级 Release 资产: $name"
